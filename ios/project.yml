name: CastRemote
options:
  bundleIdPrefix: com.majedo67
  deploymentTarget:
    iOS: "17.0"
targets:
  CastRemote:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.majedo67.castremote
        PRODUCT_NAME: CastRemote
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: CastRemote
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: CastRemote uses your local network to look for compatible TVs.
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        GENERATE_INFOPLIST_FILE: YES
