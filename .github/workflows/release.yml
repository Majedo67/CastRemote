name: Build and publish CastRemote release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v1.0.0"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  android:
    name: Build Android TV APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        working-directory: android-tv
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CastRemote-TV-APK
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk

  ios:
    name: Build unsigned iPhone IPA
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate app icon
        working-directory: ios
        run: swift scripts/make_app_icon.swift
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build unsigned iPhone app
        working-directory: ios
        run: |
          xcodebuild \
            -project CastRemote.xcodeproj \
            -scheme CastRemote \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R ios/build/Build/Products/Release-iphoneos/CastRemote.app Payload/
          /usr/bin/zip -r CastRemote-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CastRemote-iPhone-IPA
          path: CastRemote-unsigned.ipa

  publish:
    name: Attach builds to GitHub Release
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CastRemote-TV-APK
          path: release-files
      - uses: actions/download-artifact@v4
        with:
          name: CastRemote-iPhone-IPA
          path: release-files
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: CastRemote ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release-files/app-debug.apk
            release-files/CastRemote-unsigned.ipa
